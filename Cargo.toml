[package]
name = "reli"
version = "0.1.0"
edition = "2024"
description = "Reliability token network reference implementation scaffold"
license = "MIT"

[lib]
name = "reli"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
jsonschema = "0.18"

[dev-dependencies]
pretty_assertions = "1.4"
