name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Toolchain diagnostics
        run: |
          rustc --version
          cargo --version
          uname -a

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Phase0 validation gate
        run: cargo run --locked --bin validate_phase0
